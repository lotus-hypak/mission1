<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영화 연대별 갤러리</title>
<!--
  구현 결정 사항 (기획서 미정 항목)
  - 저장: 브라우저 localStorage. 카드 이동/추가/삭제 시 자동 저장, 상단 저장 버튼도 제공.
  - 삭제: 카드 오른쪽 위 × 버튼 → 확인 후 삭제.
  - 추천: 우측 패널에 15편 표시, 「추가」 버튼으로 목록에 넣음.
  - 배치: 추가 시 개봉 연도에 맞는 칸에 자동 배치. 같은 연대 안 순서 변경과 다른 연대 칸 이동 모두 허용.
  - 검색: iTunes Search API(키 불필요, 브라우저에서 직접 호출). 한국/미국 스토어 선택.
    개봉 연도는 스토어의 releaseDate 연도를 사용하며, 카드의 연도를 클릭해 수정 가능.
  - 검색 결과가 없으면 「직접 추가」로 제목/연도/포스터 URL 입력.
-->
<style>
  :root{
    --bg:#f7f7f5; --panel:#ffffff; --line:#e4e4e0; --text:#1f1f1d; --muted:#7a7a74;
    --accent:#3b6ea5; --accent-soft:#e8f0f9; --danger:#c44;
    --card-w:150px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:14px}
  button{font:inherit;cursor:pointer}
  input,select{font:inherit}

  header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.3px;margin-right:8px}
  #searchForm{display:flex;gap:6px;flex:1;min-width:360px;max-width:640px}
  #searchForm input{flex:1;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
  #searchForm select{padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .btn{padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text)}
  .btn:hover{background:#f2f2ef}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#325f90}
  .actions{display:flex;gap:6px;margin-left:auto}
  #status{width:100%;font-size:12px;color:var(--muted);min-height:16px}

  /* 검색 결과 */
  #results{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 24px}
  #results[hidden]{display:none}
  #results .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  #results h2{margin:0;font-size:15px}
  .result-list{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
  .result{flex:0 0 130px;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;display:flex;flex-direction:column;gap:6px}
  .result img,.result .noposter{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:6px;background:#eee}
  .result .t{font-size:13px;font-weight:600;line-height:1.3;max-height:2.6em;overflow:hidden}
  .result .y{font-size:12px;color:var(--muted)}
  .result button{margin-top:auto;padding:5px;border-radius:6px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
  .result button[disabled]{border-color:var(--line);background:#f2f2ef;color:var(--muted);cursor:default}

  /* 보드 */
  main{padding:20px 24px 40px;display:grid;gap:18px}
  .column{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px 16px;transition:border-color .15s,background .15s}
  .column.over{border-color:var(--accent);background:var(--accent-soft)}
  .column h2{margin:0 0 4px;font-size:16px;display:flex;align-items:baseline;gap:10px}
  .column h2 small{font-size:12px;color:var(--muted);font-weight:400}
  .cards{display:flex;flex-wrap:wrap;gap:14px;min-height:calc(var(--card-w)*1.5 + 50px);padding-top:10px}
  .empty{color:var(--muted);font-size:13px;align-self:center;padding-left:4px}

  .card{width:var(--card-w);background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;cursor:grab;position:relative;user-select:none;transition:transform .12s,box-shadow .12s}
  .card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);transform:translateY(-2px)}
  .card.dragging{opacity:.4}
  .card.insert-before{box-shadow:-4px 0 0 var(--accent)}
  .card img,.card .noposter{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:6px;background:#eee;display:block;pointer-events:none}
  .noposter{display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:12px;color:var(--muted);background:linear-gradient(160deg,#ececea,#dcdcd8)}
  .card .t{margin-top:8px;font-size:13px;font-weight:600;line-height:1.3;word-break:keep-all}
  .card .y{font-size:12px;color:var(--muted);margin-top:2px;cursor:text;display:inline-block;border-bottom:1px dashed transparent}
  .card .y:hover{border-bottom-color:var(--muted)}
  .card .del{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:none;background:rgba(255,255,255,.9);color:var(--danger);font-size:16px;line-height:1;display:none}
  .card:hover .del{display:block}

  /* 추천 패널 */
  #recPanel{position:fixed;top:0;right:0;height:100vh;width:380px;background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.06);transform:translateX(100%);transition:transform .2s;z-index:30;display:flex;flex-direction:column}
  #recPanel.open{transform:translateX(0)}
  #recPanel .head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  #recPanel h2{margin:0;font-size:16px}
  #recPanel .desc{padding:10px 18px 0;font-size:12px;color:var(--muted);line-height:1.5}
  #recList{overflow-y:auto;padding:10px 18px 24px;flex:1}
  .rec-group h3{font-size:13px;color:var(--accent);margin:14px 0 6px}
  .rec{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:4px 10px}
  .rec .t{font-weight:600;font-size:13px}
  .rec .y{font-size:12px;color:var(--muted)}
  .rec .r{grid-column:1/-1;font-size:12px;color:#444;line-height:1.45}
  .rec button{grid-row:1/3;align-self:center;padding:5px 10px;border-radius:6px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
  .rec button[disabled]{border-color:var(--line);background:#f2f2ef;color:var(--muted);cursor:default}

  dialog{border:1px solid var(--line);border-radius:12px;padding:20px 22px;width:360px}
  dialog::backdrop{background:rgba(0,0,0,.25)}
  dialog h2{margin:0 0 12px;font-size:16px}
  dialog label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  dialog input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
  dialog .row{display:flex;justify-content:flex-end;gap:6px;margin-top:16px}
</style>
</head>
<body>

<header>
  <h1>영화 연대별 갤러리</h1>
  <form id="searchForm" autocomplete="off">
    <input id="q" type="text" placeholder="영화 제목 검색 (예: 흐르는 강물처럼, A River Runs Through It)">
    <select id="country" title="검색 스토어">
      <option value="kr">한국</option>
      <option value="us">미국</option>
    </select>
    <button class="btn primary" type="submit">검색</button>
  </form>
  <div class="actions">
    <button class="btn" id="manualBtn" type="button">직접 추가</button>
    <button class="btn" id="recBtn" type="button">추천 영화</button>
    <button class="btn primary" id="saveBtn" type="button">저장</button>
  </div>
  <div id="status"></div>
</header>

<section id="results" hidden>
  <div class="head"><h2 id="resultsTitle">검색 결과</h2><button class="btn" id="closeResults" type="button">닫기</button></div>
  <div class="result-list" id="resultList"></div>
</section>

<main id="board"></main>

<aside id="recPanel" aria-label="추천 영화">
  <div class="head"><h2>추천 영화 15편</h2><button class="btn" id="closeRec" type="button">닫기</button></div>
  <div class="desc">〈흐르는 강물처럼〉, 〈가을의 전설〉과 비슷한 분위기의 잔잔한 드라마를 연대 칸마다 3편씩 골랐습니다. 「추가」를 누르면 포스터를 찾아 해당 연대 칸에 넣습니다.</div>
  <div id="recList"></div>
</aside>

<dialog id="manualDlg">
  <h2>영화 직접 추가</h2>
  <form id="manualForm" method="dialog">
    <label for="mTitle">제목</label>
    <input id="mTitle" required placeholder="영화 제목">
    <label for="mYear">개봉 연도</label>
    <input id="mYear" type="number" min="1880" max="2100" required placeholder="예: 1992">
    <label for="mPoster">포스터 이미지 주소 (선택)</label>
    <input id="mPoster" type="url" placeholder="https://...">
    <div class="row">
      <button class="btn" type="button" id="manualCancel">취소</button>
      <button class="btn primary" type="submit">추가</button>
    </div>
  </form>
</dialog>

<script>
(function(){
  'use strict';
  const STORAGE_KEY = 'movieDecadeGallery.v1';

  const DECADES = [
    {key:'1980', label:'1980년대', range:'1980~1989년'},
    {key:'1990', label:'1990년대', range:'1990~1999년'},
    {key:'2000', label:'2000년대', range:'2000~2009년'},
    {key:'2010', label:'2010년대', range:'2010~2019년'},
    {key:'other', label:'그 외', range:'1979년 이전 또는 2020년 이후'},
  ];

  const RECOMMENDATIONS = [
    {decade:'1980', title:'황금연못', en:'On Golden Pond', year:1981, reason:'호숫가와 노년의 가족 관계를 통해 자연 풍경과 가족의 정서를 함께 감상할 후보.'},
    {decade:'1980', title:'아웃 오브 아프리카', en:'Out of Africa', year:1985, reason:'넓은 자연 풍경 속 사랑과 상실을 다루어 기준 영화의 서정적인 분위기와 연결되는 후보.'},
    {decade:'1980', title:'시네마 천국', en:'Cinema Paradiso', year:1988, reason:'영화와 함께 성장하는 인물의 삶을 통해 추억과 시간의 흐름을 느낄 후보.'},
    {decade:'1990', title:'남아있는 나날', en:'The Remains of the Day', year:1993, reason:'절제된 사랑과 헌신을 다루는 작품으로, 감정을 천천히 따라가는 드라마를 원할 때 추천.'},
    {decade:'1990', title:'작은 아씨들', en:'Little Women 1994', year:1994, reason:'자매의 성장과 가족의 기억을 다루어 가족 중심의 서사를 감상할 후보.'},
    {decade:'1990', title:'스트레이트 스토리', en:'The Straight Story', year:1999, reason:'형과 화해하려는 노인의 느린 여정으로, 잔잔함과 가족의 여운을 우선할 때 추천.'},
    {decade:'2000', title:'빅 피쉬', en:'Big Fish', year:2003, reason:'아버지의 이야기를 통해 그의 삶을 알아가는 가족 드라마. 환상적인 표현이 섞인 작품도 괜찮을 때 추천.'},
    {decade:'2000', title:'네버랜드를 찾아서', en:'Finding Neverland', year:2004, reason:'작가와 아이들의 관계, 상상력과 상실을 다루는 감성적인 드라마 후보.'},
    {decade:'2000', title:'굿바이', en:'Departures', year:2008, reason:'죽음을 배웅하는 일을 통해 삶의 의미를 돌아보는 여운 있는 드라마 후보.'},
    {decade:'2010', title:'트리 오브 라이프', en:'The Tree of Life', year:2011, reason:'자연과 가족, 삶에 대한 성찰을 담은 후보. 일반적인 서사보다 추상적인 표현이 많다.'},
    {decade:'2010', title:'브루클린', en:'Brooklyn', year:2015, reason:'이민자의 삶과 사랑을 다루는 시대극으로, 인물의 감정과 선택을 따라가는 작품 후보.'},
    {decade:'2010', title:'리틀 포레스트', en:'Little Forest', year:2018, reason:'시골 생활과 계절의 변화를 담아, 자연과 일상의 잔잔함을 원할 때 추천.'},
    {decade:'other', title:'천국의 나날들', en:'Days of Heaven', year:1978, reason:'자연 풍경과 비극적인 사랑이 중심인 시대극. 영상과 정서의 여운을 원하는 경우 추천.'},
    {decade:'other', title:'미나리', en:'Minari', year:2020, reason:'새로운 땅에 정착하는 가족의 이야기로, 자연과 가족의 삶을 함께 바라볼 후보.'},
    {decade:'other', title:'퍼펙트 데이즈', en:'Perfect Days', year:2023, reason:'일상의 반복과 작은 만남을 다루어 조용한 감상과 여운을 원하는 경우 추천.'},
  ];

  // ---------- 상태 ----------
  let movies = []; // {id, title, year, poster, decade}
  let dragId = null;

  const $ = s => document.querySelector(s);
  const el = (tag, cls, text) => { const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; };
  const decadeOf = y => { y=Number(y); if(y>=1980&&y<=1989) return '1980'; if(y>=1990&&y<=1999) return '1990'; if(y>=2000&&y<=2009) return '2000'; if(y>=2010&&y<=2019) return '2010'; return 'other'; };
  const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const norm = s => String(s||'').toLowerCase().replace(/[\s:!?.,'"“”‘’\-–—()]/g,'');
  const exists = (title,year) => movies.some(m => norm(m.title)===norm(title) && Number(m.year)===Number(year));

  function setStatus(msg){ $('#status').textContent = msg; }

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ const data = JSON.parse(raw); if(Array.isArray(data.movies)) movies = data.movies; }
    }catch(e){ console.warn('불러오기 실패', e); }
  }
  function save(manual){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({movies, savedAt:new Date().toISOString()}));
      const t = new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
      setStatus((manual?'저장했습니다':'자동 저장됨')+' · '+t+' · 총 '+movies.length+'편');
    }catch(e){ setStatus('저장에 실패했습니다. 브라우저 저장 공간을 확인해 주세요.'); }
  }

  // ---------- 보드 렌더링 ----------
  function renderBoard(){
    const board = $('#board'); board.innerHTML='';
    DECADES.forEach(d=>{
      const col = el('section','column'); col.dataset.decade = d.key;
      const h = el('h2', null, d.label); h.appendChild(el('small', null, d.range)); col.appendChild(h);
      const cards = el('div','cards');
      const list = movies.filter(m=>m.decade===d.key);
      if(!list.length) cards.appendChild(el('div','empty','아직 영화가 없습니다. 검색해서 추가하거나 카드를 끌어다 놓으세요.'));
      list.forEach(m=>cards.appendChild(cardEl(m)));
      col.appendChild(cards);
      col.addEventListener('dragover', onDragOver);
      col.addEventListener('dragleave', e=>{ if(!col.contains(e.relatedTarget)) { col.classList.remove('over'); clearInsertMarks(); } });
      col.addEventListener('drop', onDrop);
      board.appendChild(col);
    });
    renderRecList();
  }

  function posterEl(m){
    if(m.poster){ const img=el('img'); img.src=m.poster; img.alt=m.title+' 포스터'; img.loading='lazy'; img.onerror=()=>{ img.replaceWith(el('div','noposter', m.title)); }; return img; }
    return el('div','noposter', m.title);
  }

  function cardEl(m){
    const c = el('article','card'); c.draggable=true; c.dataset.id=m.id;
    c.appendChild(posterEl(m));
    c.appendChild(el('div','t', m.title));
    const y = el('div','y', m.year+'년'); y.title='클릭해서 연도 수정'; c.appendChild(y);
    const del = el('button','del','×'); del.type='button'; del.title='삭제'; c.appendChild(del);

    del.addEventListener('click', e=>{ e.stopPropagation(); if(confirm('「'+m.title+'」을(를) 삭제할까요?')){ movies = movies.filter(x=>x.id!==m.id); renderBoard(); save(false); } });
    y.addEventListener('click', e=>{
      e.stopPropagation();
      const v = prompt('개봉 연도를 입력하세요', m.year);
      if(v===null) return;
      const n = parseInt(v,10);
      if(!n || n<1880 || n>2100){ alert('올바른 연도를 입력해 주세요.'); return; }
      m.year = n; m.decade = decadeOf(n); renderBoard(); save(false);
    });
    c.addEventListener('dragstart', e=>{ dragId=m.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', m.id); });
    c.addEventListener('dragend', ()=>{ dragId=null; c.classList.remove('dragging'); document.querySelectorAll('.column.over').forEach(x=>x.classList.remove('over')); clearInsertMarks(); });
    return c;
  }

  function clearInsertMarks(){ document.querySelectorAll('.card.insert-before').forEach(x=>x.classList.remove('insert-before')); }

  function onDragOver(e){
    if(!dragId) return;
    e.preventDefault(); e.dataTransfer.dropEffect='move';
    const col = e.currentTarget; col.classList.add('over');
    clearInsertMarks();
    const target = e.target.closest('.card');
    if(target && target.dataset.id!==dragId){
      const r = target.getBoundingClientRect();
      // 커서가 카드의 왼쪽 절반에 있으면 그 카드 앞, 오른쪽이면 다음 카드 앞
      if(e.clientX < r.left + r.width/2) target.classList.add('insert-before');
      else { const next = target.nextElementSibling; if(next && next.classList.contains('card') && next.dataset.id!==dragId) next.classList.add('insert-before'); }
    }
  }

  function onDrop(e){
    if(!dragId) return;
    e.preventDefault();
    const col = e.currentTarget; const toDecade = col.dataset.decade;
    const marked = col.querySelector('.card.insert-before');
    const beforeId = marked ? marked.dataset.id : null;

    const idx = movies.findIndex(m=>m.id===dragId); if(idx<0) return;
    const [mv] = movies.splice(idx,1); mv.decade = toDecade;
    if(beforeId){ const bi = movies.findIndex(m=>m.id===beforeId); movies.splice(bi,0,mv); }
    else { // 해당 연대의 마지막 뒤에 삽입
      let last=-1; movies.forEach((m,i)=>{ if(m.decade===toDecade) last=i; });
      movies.splice(last+1,0,mv);
    }
    dragId=null; renderBoard(); save(false);
  }

  function addMovie({title,year,poster}){
    const y = parseInt(year,10);
    if(exists(title,y)){ setStatus('이미 목록에 있는 영화입니다: '+title); return false; }
    movies.push({id:uid(), title:String(title).trim(), year:y, poster:poster||'', decade:decadeOf(y)});
    renderBoard(); save(false);
    setStatus('「'+title+'」을(를) '+DECADES.find(d=>d.key===decadeOf(y)).label+' 칸에 추가했습니다.');
    return true;
  }

  // ---------- 검색 (iTunes Search API) ----------
  async function searchMovies(term, country){
    const url = 'https://itunes.apple.com/search?media=movie&entity=movie&limit=12&country='+encodeURIComponent(country)+'&term='+encodeURIComponent(term);
    const res = await fetch(url);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    return (data.results||[]).map(r=>({
      title: r.trackName,
      year: r.releaseDate ? new Date(r.releaseDate).getFullYear() : '',
      poster: r.artworkUrl100 ? r.artworkUrl100.replace(/100x100bb/, '600x600bb') : '',
      genre: r.primaryGenreName||''
    })).filter(r=>r.title && r.year);
  }

  function renderResults(list, term){
    const box = $('#results'); const wrap = $('#resultList'); wrap.innerHTML='';
    $('#resultsTitle').textContent = '「'+term+'」 검색 결과 '+list.length+'건';
    if(!list.length){ const p = el('div','empty','검색 결과가 없습니다. 영문 제목으로 다시 검색하거나 스토어를 바꾸거나, 「직접 추가」를 이용해 주세요.'); wrap.appendChild(p); }
    list.forEach(r=>{
      const c = el('div','result');
      c.appendChild(posterEl(r));
      c.appendChild(el('div','t', r.title));
      c.appendChild(el('div','y', r.year+'년'+(r.genre?' · '+r.genre:'')));
      const b = el('button', null, exists(r.title,r.year)?'추가됨':'추가'); b.type='button'; b.disabled = exists(r.title,r.year);
      b.addEventListener('click', ()=>{ if(addMovie(r)){ b.textContent='추가됨'; b.disabled=true; } });
      c.appendChild(b); wrap.appendChild(c);
    });
    box.hidden=false;
  }

  $('#searchForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const term = $('#q').value.trim(); if(!term) return;
    const country = $('#country').value;
    setStatus('검색 중…');
    try{
      let list = await searchMovies(term, country);
      if(!list.length && country==='kr'){ list = await searchMovies(term,'us'); if(list.length) setStatus('한국 스토어에 결과가 없어 미국 스토어 결과를 표시합니다.'); }
      if(list.length && !$('#status').textContent.startsWith('한국')) setStatus('검색 완료. 원하는 영화의 「추가」를 누르세요.');
      renderResults(list, term);
    }catch(err){
      console.error(err);
      setStatus('검색에 실패했습니다. 인터넷 연결을 확인하거나 「직접 추가」를 이용해 주세요.');
      renderResults([], term);
    }
  });
  $('#closeResults').addEventListener('click', ()=>{ $('#results').hidden=true; });

  // ---------- 직접 추가 ----------
  const dlg = $('#manualDlg');
  $('#manualBtn').addEventListener('click', ()=>{ $('#manualForm').reset(); dlg.showModal(); $('#mTitle').focus(); });
  $('#manualCancel').addEventListener('click', ()=>dlg.close());
  $('#manualForm').addEventListener('submit', e=>{
    e.preventDefault();
    addMovie({title:$('#mTitle').value, year:$('#mYear').value, poster:$('#mPoster').value.trim()});
    dlg.close();
  });

  // ---------- 추천 패널 ----------
  function renderRecList(){
    const wrap = $('#recList'); wrap.innerHTML='';
    DECADES.forEach(d=>{
      const g = el('div','rec-group'); g.appendChild(el('h3', null, d.label));
      RECOMMENDATIONS.filter(r=>r.decade===d.key).forEach(r=>{
        const item = el('div','rec');
        item.appendChild(el('div','t', r.title+' ('+r.en.replace(/ \d{4}$/,'')+')'));
        item.appendChild(el('div','y', r.year+'년'));
        const added = exists(r.title,r.year) || exists(r.en.replace(/ \d{4}$/,''),r.year);
        const b = el('button', null, added?'추가됨':'추가'); b.type='button'; b.disabled=added;
        b.addEventListener('click', ()=>addRecommendation(r,b));
        item.appendChild(b);
        item.appendChild(el('div','r', r.reason));
        g.appendChild(item);
      });
      wrap.appendChild(g);
    });
  }

  async function addRecommendation(r, btn){
    btn.disabled=true; btn.textContent='포스터 찾는 중…';
    let poster='';
    try{
      // 한국 스토어 → 미국 스토어 순으로 포스터 검색. 연도가 ±1년 이내인 결과를 우선.
      for(const country of ['kr','us']){
        const list = await searchMovies(r.en, country);
        const hit = list.find(x=>Math.abs(x.year-r.year)<=1) || list.find(x=>Math.abs(x.year-r.year)<=2);
        if(hit){ poster=hit.poster; break; }
      }
    }catch(e){ console.warn('포스터 검색 실패', e); }
    const ok = addMovie({title:r.title, year:r.year, poster});
    btn.textContent = ok?'추가됨':'추가됨';
    if(!poster && ok) setStatus('「'+r.title+'」을(를) 추가했습니다. 포스터를 찾지 못해 제목만 표시합니다.');
  }

  $('#recBtn').addEventListener('click', ()=>$('#recPanel').classList.toggle('open'));
  $('#closeRec').addEventListener('click', ()=>$('#recPanel').classList.remove('open'));

  // ---------- 저장 ----------
  $('#saveBtn').addEventListener('click', ()=>save(true));

  // ---------- 시작 ----------
  load();
  renderBoard();
  setStatus(movies.length ? '저장된 배치를 불러왔습니다 · 총 '+movies.length+'편' : '영화 제목을 검색해 추가하세요. 배치는 이 브라우저에 자동 저장됩니다.');
})();
</script>
</body>
</html>
